name: CI Pipeline

# Docs-only changes (markdown, LICENSE) don't execute code — skip the pipeline.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: microcoreos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Real Redis so the state parity suite (tests/tools/test_state_parity.py)
      # runs against actual infrastructure instead of skipping itself.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      # Real RabbitMQ so the broker parity suite
      # (tests/tools/test_event_bus_rabbitmq_parity.py) runs instead of skipping.
      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      # RustFS needs a custom command so it can't run as a service container —
      # started as a step instead (same pattern as smoke-boot uses for S3).
      # The S3 parity fixture sets all credentials via monkeypatch; no extra
      # env vars are needed here.
      - name: Start RustFS (S3 parity tests)
        run: |
          docker run -d --rm --name rustfs -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY=minioadmin -e RUSTFS_SECRET_KEY=minioadmin \
            rustfs/rustfs:latest server /data --console-address ":9001"
          echo "Waiting for RustFS..."
          for i in $(seq 1 30); do
            if curl -s --max-time 2 http://localhost:9000 > /dev/null 2>&1; then
              echo "RustFS ready after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "RustFS did not respond after 60s"
          docker logs rustfs
          exit 1

      - name: Lint (ruff)
        run: uv run -m ruff check .

      - name: Verify core compilation (Syntax Check)
        run: |
          uv run python -c "from microcoreos.kernel import Kernel; print('✅ Kernel OK')"
          uv run python -c "from microcoreos.container import Container; print('✅ Container OK')"
          uv run python -c "from microcoreos import BasePlugin; print('✅ BasePlugin OK')"
          uv run python -c "from microcoreos import BaseTool; print('✅ BaseTool OK')"

      - name: Run Core Tests
        run: uv run -m pytest tests/ -v --tb=short

  # Boots the REAL system against REAL infrastructure (MinIO as S3, SQLite on
  # disk) and asserts that every tool is OK and every plugin is READY. This is
  # the gate that makes boot-time validation count: a tool can only prove it is
  # alive if its backend is actually mounted.
  smoke-boot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install dependencies
        run: uv sync --dev

      # RustFS needs a custom command so it can't run as a service container —
      # started as a step instead.
      - name: Start RustFS (real S3 backend)
        run: |
          docker run -d --rm --name rustfs -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY=minioadmin -e RUSTFS_SECRET_KEY=minioadmin \
            rustfs/rustfs:latest server /data --console-address ":9001"
          echo "Waiting for RustFS..."
          for i in $(seq 1 30); do
            if curl -s --max-time 2 http://localhost:9000 > /dev/null 2>&1; then
              echo "RustFS ready after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "RustFS did not respond after 60s"
          docker logs rustfs
          exit 1

      - name: Boot system against real infrastructure
        env:
          PYTHONUNBUFFERED: "1"
          AUTH_SECRET_KEY: ci-smoke-test-secret-key-0123456789abcdef
          HTTP_PORT: "5000"
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_S3_ENDPOINT_URL: http://localhost:9000
          AWS_S3_VERIFY_SSL: "false"
        run: |
          cp -r extras/available_tools/s3 tools/
          # auth is an extra now; this job is the only one that boots against
          # real infrastructure, so it installs auth rather than dropping it.
          cp -r extras/available_tools/auth tools/
          cp -r extras/available_domains/users domains/
          uv run main.py > boot.log 2>&1 &
          APP_PID=$!

          # Wait until the gateway answers (max 30s)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/system/status > /dev/null 2>&1; then break; fi
            sleep 1
          done

          curl -sf http://localhost:5000/system/status > status.json

          # Assert: every tool OK, every plugin READY
          uv run python - <<'EOF'
          import json
          status = json.load(open("status.json"))
          assert status["success"], "system/status reported failure"
          bad_tools = [t for t in status["data"]["tools"] if t["status"] != "OK"]
          bad_plugins = [p for p in status["data"]["plugins"] if p["status"] != "READY"]
          assert not bad_tools, f"Tools not OK: {bad_tools}"
          assert not bad_plugins, f"Plugins not READY: {bad_plugins}"
          names = {t["name"] for t in status["data"]["tools"]}
          assert {"db", "s3", "http", "auth", "event_bus", "state"} <= names, f"Missing tools: {names}"
          print(f"✅ {len(status['data']['tools'])} tools OK, {len(status['data']['plugins'])} plugins READY")
          EOF

          # Assert: S3 connected to REAL infrastructure (not degraded mode)
          grep -q "\[S3Tool\] Connected" boot.log || { echo "S3 did not connect to MinIO"; cat boot.log; exit 1; }

          # Lint gate: the boot linters are advisory at runtime, but CI is the
          # hard gate — any arch violation, tool drift, or event contract
          # warning on the booted system fails the pipeline.
          curl -sf http://localhost:5000/system/lint > lint.json
          uv run python - <<'EOF'
          import json
          lint = json.load(open("lint.json"))
          assert lint["success"], "system/lint reported failure"
          data = lint["data"]
          contract_warnings = [
              f for f in data["event_contract_violations"]
              if f.get("severity") == "warning"
          ]
          assert not data["arch_violations"], f"Arch violations: {data['arch_violations']}"
          assert not data["drift_warnings"], f"Tool drift: {data['drift_warnings']}"
          assert not contract_warnings, f"Event contract warnings: {contract_warnings}"
          print("✅ Lint gate clean: no arch violations, no drift, no contract warnings")
          EOF

          kill $APP_PID

      - name: Show boot log on failure
        if: failure()
        run: cat boot.log || true

  # Everything above exercises the REPO. This exercises the PACKAGE: build the
  # wheel, install it where none of the repo's source can leak in, and drive
  # the whole onboarding path.
  #
  # This job exists because three shipped bugs were reachable ONLY this way,
  # and the suite was green through all of them: the console script does not
  # put the project on sys.path (a checkout gets that for free), load_dotenv()
  # resolves against site-packages instead of the project, and `upgrade` lost
  # track of an extra installed by hand. None of those can exist when the code
  # runs from a checkout — which is the only way the other jobs run it.
  packaged-e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Build the wheel
        run: uv build --wheel -o "$GITHUB_WORKSPACE/dist"

      - name: Install it in a venv with no access to the repo
        run: |
          mkdir -p /tmp/e2e && cd /tmp/e2e
          uv venv
          # [auth] matters: bcrypt and pyjwt are no longer base dependencies,
          # so this also proves the extra carries what its tool imports.
          uv pip install "$(ls "$GITHUB_WORKSPACE"/dist/*.whl)[scheduler,auth]"
          ./.venv/bin/microcoreos --help

      - name: microcoreos new
        working-directory: /tmp/e2e
        run: |
          ./.venv/bin/microcoreos new app
          cd app
          test -f README.md                                   # the human entry point
          test -f .microcoreos/manifest.json                  # the upgrade baseline
          test -f .gitignore
          test -f main.py
          test -f tools/sqlite/sqlite_tool.py
          test -d extras/available_tools                      # the swap catalog
          test ! -d domains/ping                              # demos stay behind

          # Auth is an extra: available, not installed. A fresh project has no
          # users table and no AUTH_SECRET_KEY to set before it boots.
          test ! -d tools/auth
          test ! -d domains/users
          test -f extras/available_tools/auth/auth_tool.py
          test -f extras/available_domains/users/plugins/logout_plugin.py
          # ...and the CRUD half must not have ridden along inside the extra.
          test ! -f extras/available_domains/users/plugins/get_users_plugin.py
          test ! -d microcoreos                               # the Kernel is NOT copied

      - name: Boot it and use auth, once installed
        working-directory: /tmp/e2e/app
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          # The dependency came with the wheel's [auth] extra above, so this
          # only has to move the source and write the .env keys.
          /tmp/e2e/.venv/bin/microcoreos add auth --no-install
          test -f tools/auth/auth_tool.py
          test -f domains/users/plugins/logout_plugin.py
          grep -q "^AUTH_SECRET_KEY=" .env

          /tmp/e2e/.venv/bin/microcoreos > boot.log 2>&1 &
          APP_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/system/status > /dev/null 2>&1; then break; fi
            sleep 1
          done

          # A scaffolded project must boot with nothing failing. An empty
          # system also answers "Ready", so assert on the tool inventory.
          curl -sf http://localhost:5000/system/status > status.json
          python3 - <<'EOF'
          import json
          tools = json.load(open("status.json"))["data"]["tools"]
          failed = [t for t in tools if t["status"] != "OK"]
          assert not failed, f"tools not OK: {failed}"
          assert len(tools) >= 10, f"suspiciously few tools discovered: {tools}"
          print(f"✅ {len(tools)} tools OK")
          EOF

          # register → token → protected endpoint
          curl -sf -X POST http://localhost:5000/users -H 'Content-Type: application/json' \
            -d '{"name":"CI","email":"ci@test.com","password":"secret123"}' > /dev/null
          TOKEN=$(curl -sf -X POST http://localhost:5000/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"ci@test.com","password":"secret123"}' | python3 -c "import sys,json;print(json.load(sys.stdin)['data']['token'])")
          curl -sf http://localhost:5000/users/me -H "Authorization: Bearer $TOKEN" | grep -q '"email":"ci@test.com"'
          curl -s http://localhost:5000/users/me | grep -q 'Missing authorization token'
          echo "✅ auth works end to end after add"

          grep -q "🔥" boot.log && { echo "load errors in boot"; exit 1; } || true
          kill $APP_PID

      - name: microcoreos add
        working-directory: /tmp/e2e/app
        run: |
          # --no-install because the dependency comes from the wheel built
          # above, not from an index: `uv add 'microcoreos[scheduler]'` cannot
          # resolve until the package is published.
          /tmp/e2e/.venv/bin/microcoreos add scheduler --no-install
          test -f tools/scheduler/scheduler_tool.py
          test -d domains/scheduler/plugins
          test ! -d extras/available_tools/scheduler      # moved, not copied
          grep -q "SCHEDULER_ENABLED" .env

      - name: microcoreos upgrade — a fix reaches an extra you moved
        working-directory: /tmp/e2e/app
        run: |
          TEMPLATE=$(echo /tmp/e2e/.venv/lib/python3*/site-packages/microcoreos/_template)
          echo "# upstream fix" >> "$TEMPLATE/extras/available_tools/scheduler/scheduler_tool.py"

          /tmp/e2e/.venv/bin/microcoreos upgrade --apply
          tail -1 tools/scheduler/scheduler_tool.py | grep -q "upstream fix"
          echo "✅ upgrade tracked the extra to where it was moved"

      - name: microcoreos upgrade — your edit survives, twice
        working-directory: /tmp/e2e/app
        run: |
          TEMPLATE=$(echo /tmp/e2e/.venv/lib/python3*/site-packages/microcoreos/_template)
          echo "# MY PATCH" >> tools/logger/logger_tool.py
          echo "# upstream fix" >> "$TEMPLATE/tools/logger/logger_tool.py"

          # Twice on purpose: rewriting the whole baseline after --apply used
          # to re-stamp the conflicted file as "never edited", so the SECOND
          # run overwrote the patch this one refused to touch.
          /tmp/e2e/.venv/bin/microcoreos upgrade --apply
          /tmp/e2e/.venv/bin/microcoreos upgrade --apply
          tail -1 tools/logger/logger_tool.py | grep -q "MY PATCH"
          echo "✅ local edits survive repeated --apply"

      - name: Show boot log on failure
        if: failure()
        run: cat /tmp/e2e/app/boot.log || true

  # The same package paths on Windows. Everything above runs on Linux only, so
  # the one thing this job is here to execute is path handling: the manifest is
  # a published format whose keys are POSIX-style on every platform, and
  # `new` / `add` / `upgrade` are the three commands that write it.
  #
  # Scope is deliberate. The boot/HTTP half of packaged-e2e is NOT repeated
  # here — that would drag in service containers Windows runners do not offer,
  # and buy coverage of a path this job is not about. Booting on Windows stays
  # unexercised, and docs/TECH_DEBT.md says so.
  packaged-e2e-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash        # Git Bash ships on the runner; keeps this readable.

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install dependencies
        run: uv sync --dev

      # The filesystem-facing suites. The rest of tests/ needs Postgres, Redis
      # and RabbitMQ, which is what the Linux matrix is for.
      - name: Path and packaging suites
        run: uv run -m pytest tests/test_upgrade.py tests/test_scaffold.py tests/test_catalog.py tests/test_cli.py -q

      - name: Build the wheel
        run: uv build --wheel -o dist

      - name: Install it in a venv with no access to the repo
        run: |
          mkdir -p "$RUNNER_TEMP/e2e" && cd "$RUNNER_TEMP/e2e"
          uv venv
          # [auth] matters: bcrypt and pyjwt are no longer base dependencies,
          # so this also proves the extra carries what its tool imports.
          uv pip install "$(ls "$GITHUB_WORKSPACE"/dist/*.whl)[scheduler,auth]"
          ./.venv/Scripts/microcoreos --help

      - name: microcoreos new
        run: |
          cd "$RUNNER_TEMP/e2e"
          ./.venv/Scripts/microcoreos new app
          cd app
          test -f main.py
          test -f .microcoreos/manifest.json
          test -f tools/sqlite/sqlite_tool.py
          test ! -d microcoreos

          # The whole point of this job: a manifest written by Windows must not
          # carry a single backslash, or every path in it misses on Linux.
          python - <<'EOF'
          import json
          m = json.load(open(".microcoreos/manifest.json", encoding="utf-8"))
          bad = [p for p in m["files"] if "\\" in p]
          assert not bad, f"backslashes in manifest keys: {bad[:5]}"
          print(f"OK {len(m['files'])} manifest paths, all POSIX-style")
          EOF

      - name: microcoreos add
        run: |
          cd "$RUNNER_TEMP/e2e/app"
          ../.venv/Scripts/microcoreos add scheduler --no-install
          test -f tools/scheduler/scheduler_tool.py
          test ! -d extras/available_tools/scheduler
          python - <<'EOF'
          import json
          moved = json.load(open(".microcoreos/manifest.json", encoding="utf-8"))["moved"]
          assert moved, "add recorded no move"
          bad = [p for p in list(moved) + list(moved.values()) if "\\" in p]
          assert not bad, f"backslashes in recorded moves: {bad}"
          print(f"OK moves recorded POSIX-style: {moved}")
          EOF

      - name: microcoreos upgrade — tracks a move, applies a fix, withdraws a file
        run: |
          cd "$RUNNER_TEMP/e2e/app"
          TEMPLATE=$(echo "$RUNNER_TEMP"/e2e/.venv/Lib/site-packages/microcoreos/_template)

          # 1. A fix reaches an extra `add` moved.
          echo "# upstream fix" >> "$TEMPLATE/extras/available_tools/scheduler/scheduler_tool.py"

          # 2. A folder renamed off-convention is found by content.
          mv extras/available_tools/postgresql tools/my-db

          # 3. A file withdrawn upstream is deleted here.
          rm "$TEMPLATE/tools/state/state_tool.py"

          ../.venv/Scripts/microcoreos upgrade --apply

          tail -1 tools/scheduler/scheduler_tool.py | grep -q "upstream fix"
          test -f tools/my-db/postgresql_tool.py
          test ! -f tools/state/state_tool.py
          python - <<'EOF'
          import json
          moved = json.load(open(".microcoreos/manifest.json", encoding="utf-8"))["moved"]
          assert moved.get("extras/available_tools/postgresql") == "tools/my-db", moved
          print("OK rename tracked by content, POSIX-style")
          EOF
