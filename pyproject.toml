[project]
name = "microcoreos"
version = "0.2.1"
description = "Atomic Microkernel Architecture optimized for AI-Driven Development"
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
# The base set: what the Kernel plus the tools materialized by default
# (`microcoreos new`) need to boot. Everything a swappable tool needs lives in
# an extra below, so `uv add microcoreos` installs no broker client nobody uses.
dependencies = [
    "aiosqlite>=0.20.0",
    "fastapi>=0.115.0",
    "pydantic[email]>=2.10.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.3",
    "uvicorn>=0.30.0",
    # No `import websockets` anywhere: it is uvicorn's WS protocol
    # implementation, required at runtime by HttpServerTool.add_ws_endpoint().
    "websockets>=13.0",
]

[project.optional-dependencies]
auth = ["bcrypt>=3.2.2", "pyjwt>=2.9.0"]
redis = ["redis>=5.0"]
postgres = ["asyncpg>=0.29.0"]
kafka = ["aiokafka>=0.14.0"]
rabbitmq = ["aio-pika>=9.4"]
s3 = ["aioboto3>=15.5.0"]
scheduler = ["apscheduler>=3.10,<4"]
all = [
    "aio-pika>=9.4",
    "aioboto3>=15.5.0",
    "aiokafka>=0.14.0",
    "apscheduler>=3.10,<4",
    "asyncpg>=0.29.0",
    "bcrypt>=3.2.2",
    "pyjwt>=2.9.0",
    "redis>=5.0",
]

[project.scripts]
microcoreos = "microcoreos.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["**/__pycache__", "**/*.pyc", "**/*.db", "**/*.db-wal", "**/*.db-shm", "**/docs/internal/**"]

[tool.hatch.build.targets.wheel]
# Two importable packages. `microcoreos` is the framework a booted app depends
# on; `microcoreos_dev` is the plan pipeline — development tooling that never
# runs inside your application, and that the framework never imports (enforced
# by tests/test_core_purity.py).
#
# They ship in ONE wheel on purpose. Publishing `microcoreos-dev` separately
# would buy only that its modules stay off a production install, where they are
# inert anyway — and it would cost the thing that matters: `microcoreos new`
# never overwrites an existing pyproject.toml, so it cannot add a dev
# dependency to it, and `uv init && uv add microcoreos && microcoreos new .`
# would leave every user's first `microcoreos migrate` asking them to install a
# second package. That command is what writes AI_CONTEXT.md — the agent's whole
# context — so the split would break onboarding at its most important step.
# Measured, not assumed: that is exactly what happened when the wheel shipped
# `microcoreos` alone. See docs/DEV_PACKAGE_SPLIT.md.
packages = ["microcoreos", "microcoreos_dev"]

# tools/, domains/ and the rest ride along as INERT payload under
# microcoreos/_template/ and are copied out as the user's own source by
# `microcoreos new` — see Issue 39 in ROADMAP.md. Nothing under _template/ is
# ever imported from site-packages.

# The template payload is NOT listed here. `hatch_build.py` derives it from
# scaffold.RUNTIME_ENTRIES, which is the same list `microcoreos new` walks in a
# checkout — a second, hand-maintained copy is what shipped a wrong wheel once.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "migrations(*domains): apply these domains' real migrations to the `db` fixture",
]

[tool.ruff.lint]
# E701 (one-line `if x: return y`) is an accepted idiom in this codebase.
ignore = ["E701"]
# PLW1514: `open`/`read_text`/`write_text` without an explicit encoding. On
# Linux the default is UTF-8 and the omission is invisible; on Windows it is
# cp1252, and any file with an em dash in it fails to read. Windows CI caught
# this once across 82 sites in tests/ — the rule is here so it stays caught.
# It is still a preview rule, hence the flag.
# `select` is pinned to ruff's current default set plus that one rule: preview
# mode also widens the default selection, and this project is not opting into
# the other few hundred rules today.
select = ["E4", "E7", "E9", "F", "PLW1514"]
preview = true
explicit-preview-rules = true

[dependency-groups]
dev = [
    # The suite exercises every swappable tool, including the ones whose client
    # is an extra for users (redis, postgres, kafka, rabbitmq, s3, scheduler).
    "microcoreos[all]",
    "anyio[trio]>=4.0.0",
    # Test-only: the suite drives the ASGI app through httpx's ASGITransport.
    "httpx>=0.28.1",
    "pytest>=8.0.0",
    "ruff>=0.15.16",
    # Test-only + `microcoreos dev` (imported lazily, with an install message).
    "watchfiles>=1.1.1",
]
