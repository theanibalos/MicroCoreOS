# Active Plan — the formal contract (schema: docs/PARALLEL_DEVELOPMENT.md "Formal plan format")
#
# THIS FILE IS A TEMPLATE. The Planner AI replaces it with the real plan and
# DELETES the `template: true` line below. Until that line is gone, validation
# fails on purpose: the template is a valid plan, so nothing else could tell it
# apart from yours, and an agent told to build X will otherwise happily build
# the example domain instead and report success.
#
# THIS PATH IS THE ONLY ONE THAT EXECUTES. Write the plan here — not in
# plans/my_feature.yaml. The workflows, the executor prompts and the checklist
# cross-check all read `plans/active_plan.yaml` and nothing else. A plan under
# any other name is a plan nothing will ever run.
#
#   microcoreos plan validate      # offline, no server, zero errors before anything runs
#   microcoreos migrate            # after phase 0: applies migrations + regenerates AI_CONTEXT.md
#   microcoreos schema             # what the database actually has now
#
# SIZING RULES (docs/PARALLEL_DEVELOPMENT.md → "Plan sizing"):
#   - Omit phase_0 entirely if no new tables/tools — and with it, `engine:`,
#     whose only reader is the phase 0 author writing engine-specific SQL.
#   - Omit flows entirely if no plugin publishes or consumes events.
#   - A domain with 3 CRUDs + one event chain ≈ 80-120 lines, ONE pass.
#
# YAML RULE: quote any value containing '{' or '[' —
# path: "/orders/{order_id}", note: "Optional[str]". Unquoted it is a parse
# error, and every REST plan has {param} routes.

plan:
  template: true                            # DELETE THIS LINE — see the header
  domain: catalog
  engine: sqlite                            # which db engine this plan's SQL targets (informative — migrations run verbatim)

  phase_0:                                  # OMIT if no new tables/tools
    migrations:
      - file: catalog/001_create_catalog.sql
        tables: [products]
        columns:                            # full schema — phase 0 is built from this
          products:
            id: "INTEGER PRIMARY KEY"       # auto-increment PK spelling is engine-specific — match the declared engine
            name: "TEXT NOT NULL"
            price_cents: "INTEGER NOT NULL"
            created_at: "TIMESTAMP DEFAULT CURRENT_TIMESTAMP"
            # Table-level constraints (UNIQUE(a, b), FOREIGN KEY, CHECK) do NOT
            # go here — `columns:` maps a column NAME to its SQL. Write them in
            # the .sql file; the validator reads them back from there.
    models:
      - domains/catalog/models/product.py   # the domain's vocabulary, not a blind mirror
    tools: []                               # new infra tools, only if needed

  # Three feature shapes exist. All three are below, because the ones that were
  # missing are the ones planners got wrong.
  features:

    # 1. PUBLISHER — an endpoint that writes and announces.
    - plugin: CreateProductPlugin
      file: domains/catalog/plugins/create_product_plugin.py
      function: "Create a product and announce it"
      route: { method: POST, path: /products }
      db: { writes: [products], reads: [] }
      publishes:
        - event: product.created
          model: ProductCreatedPayload      # rule 6: a published event names its model
          payload: { id: int, name: str, price_cents: int }
      consumes: []
      # EVERY tool THIS plugin's __init__ takes — not a fixed list, and not
      # just the interesting ones. These four because this feature declares a
      # route (http) and must not leak str(e) (logger); the pure consumer
      # below names neither. A test has to pass exactly this list, so an
      # incomplete one is what makes the test author invent the difference.
      tools: [http, db, event_bus, logger]
      test: tests/test_create_product_plugin.py

    # 2. READER — a plain endpoint. No events, so no flow.
    #    Note the quotes: an unquoted {product_id} is a YAML parse error.
    - plugin: GetProductPlugin
      file: domains/catalog/plugins/get_product_plugin.py
      function: "Fetch one product by id"
      route: { method: GET, path: "/products/{product_id}" }
      db: { writes: [], reads: [products] }
      publishes: []
      consumes: []
      tools: [http, db, logger]
      test: tests/test_get_product_plugin.py

    # 3. PURE CONSUMER — reacts to an event, serves no HTTP.
    #    OMIT `route:` entirely. `route: {}` is not "no route": it is a route
    #    missing its required method and path, and it fails validation.
    #    `consumes:` takes `requires:` — the keys this feature reads. It never
    #    takes `model:`/`payload:` (those belong to publishes:): a consumer is a
    #    TOLERANT READER and must not import the publisher's model.
    - plugin: ProductSearchIndexPlugin
      file: domains/catalog/plugins/product_search_index_plugin.py
      function: "Keep the search index in step with the catalog"
      db: { writes: [], reads: [] }
      publishes: []
      consumes:
        - event: product.created
          requires: [id, name]
      tools: [event_bus, state]
      # `tools` says WHICH tool; `touches` says WHICH RESOURCES, in the shape
      # the tool itself declares (rule 19). Required for every tool that
      # namespaces names a feature invents — `state` keys here, `db` tables
      # above. Without it the plugin author and the test author each invent a
      # different layout and only find out at the assertion.
      touches:
        state:
          writes:
            - "search-index:{product_id}"    # the entry
            - "search-index-seen:{event_id}" # the idempotency guard
      test: tests/test_product_search_index_plugin.py

  # OMIT this whole section if no plugin publishes or consumes events.
  # A flow is `links:`, never `steps:`. Every consumption declared above must
  # appear as a link here (rule 7) — a link is where the sad path gets decided,
  # so an unlinked consumer is a feature whose failure behaviour nobody chose.
  flows:
    - name: "Product created → search index"
      durability: ephemeral                 # `durable` needs a durable transport (rule 13)
      happy_path: "POST /products → product.created → index updated"
      e2e_test: tests/test_catalog_index_chain.py     # rule 8: mandatory
      sad_path_test: tests/test_catalog_index_dlq.py  # rule 12: mandatory once retries/DLQ/compensation appear
      links:
        - consumes: product.created
          consumer: ProductSearchIndexPlugin
          retries: 2                        # >0 ⇒ redelivery ⇒ idempotent is mandatory (rule 9)
          idempotent: true
          idempotency_test: tests/test_product_search_index_plugin.py::test_double_delivery
          # dlq_watcher: DlqAlertPlugin     # only if some plugin consumes _dlq.product.created (rule 10)
          # compensation: product.unindexed # only if the event is BOTH published and consumed (rule 11)
